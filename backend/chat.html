<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 28px 16px;

            font-family: Arial, Helvetica, sans-serif;
            color: #33242b;

            /* Your pink flower background */
            background-color: #eee9e4;
            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.08)
                ),
                url("/static/background.jpg");

            background-size: cover;
            background-repeat: no-repeat;

            /* Keep the flowers near the top visible */
            background-position: center top;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            width: 100%;
            max-width: 680px;
            padding: 26px;

            background: rgba(255, 255, 255, 0.84);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 22px;

            box-shadow: 0 12px 45px rgba(75, 30, 49, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: #a32760;
            font-size: 30px;
            margin: 0 0 8px;
        }

        .header p {
            color: #705663;
            margin: 0;
            font-size: 14px;
        }

        .lock-icon {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #59404c;
        }

        input {
            width: 100%;
            padding: 12px 13px;

            border: 1px solid #dbc2ce;
            border-radius: 10px;

            background: rgba(255, 255, 255, 0.94);
            color: #33242b;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #a32760;
            box-shadow: 0 0 0 3px rgba(163, 39, 96, 0.1);
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;

            background: #a32760;
            color: white;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: #81204b;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .connect-button {
            width: 100%;
            margin-top: 2px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            margin: 16px 0;
            padding: 10px;

            border-radius: 9px;
            background: rgba(246, 233, 239, 0.8);

            color: #705663;
            font-size: 13px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #999;
        }

        .status.connected .status-dot {
            background: #26965b;
        }

        .status.error .status-dot {
            background: #d33c45;
        }

        .messages-title {
            margin: 18px 0 9px;
            font-size: 15px;
            color: #59404c;
        }

        .messages {
            height: 290px;
            overflow-y: auto;
            overflow-wrap: anywhere;

            padding: 13px;
            margin-bottom: 15px;

            border: 1px solid rgba(163, 39, 96, 0.18);
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.66);
        }

        .empty-message {
            margin-top: 100px;
            color: #927b87;
            font-size: 14px;
            text-align: center;
        }

        .message {
            width: fit-content;
            max-width: 92%;

            padding: 10px 12px;
            margin: 9px 0;

            border-radius: 12px;
            background: rgba(244, 220, 232, 0.9);

            font-size: 14px;
            line-height: 1.45;
        }

        .message .sender {
            color: #922350;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .message .text {
            white-space: pre-wrap;
        }

        .message-form {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-form input {
            flex: 1;
            min-width: 0;
        }

        .message-form button {
            flex-shrink: 0;
        }

        .security-note {
            margin-top: 19px;
            color: #775f6b;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px 10px;
                background-position: center top;
                background-attachment: scroll;
            }

            .chat-container {
                padding: 18px;
                border-radius: 17px;
            }

            .header h1 {
                font-size: 26px;
            }

            .messages {
                height: 260px;
            }

            .message-form {
                flex-wrap: wrap;
            }

            .message-form input {
                width: 100%;
                flex-basis: 100%;
            }

            .message-form button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="chat-container">

        <header class="header">
            <div class="lock-icon">🔐</div>
            <h1>Secure Chat</h1>
            <p>Private messaging demonstration</p>
        </header>

        <section aria-label="Chat connection settings">

            <div class="field">
                <label for="room">Room ID</label>
                <input
                    id="room"
                    type="number"
                    min="1"
                    value="1"
                    required
                >
            </div>

            <div class="field">
                <label for="username">Your username</label>
                <input
                    id="username"
                    type="text"
                    maxlength="40"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="passphrase">Shared secret passphrase</label>
                <input
                    id="passphrase"
                    type="password"
                    placeholder="Use the same passphrase in both sessions"
                    autocomplete="off"
                    required
                >
            </div>

            <button id="connectButton" class="connect-button" type="button">
                Connect to Chat
            </button>

        </section>

        <div id="status" class="status" role="status" aria-live="polite">
            <span class="status-dot"></span>
            <span id="statusText">Not connected</span>
        </div>

        <h2 class="messages-title">Messages</h2>

        <section id="messages" class="messages"
                 aria-label="Chat messages" aria-live="polite">
            <p id="emptyMessage" class="empty-message">
                Connect to a room to start chatting.
            </p>
        </section>

        <form id="messageForm" class="message-form">
            <input
                id="messageInput"
                type="text"
                placeholder="Write a message..."
                maxlength="2000"
                autocomplete="off"
                disabled
                required
            >

            <button id="sendButton" type="submit" disabled>
                Send
            </button>
        </form>

        <p class="security-note">
            Messages are encrypted in your browser before transmission.
            Both participants must use the same room ID and passphrase.
            This is a learning prototype, not a production-secure messenger.
        </p>

    </main>

    <script>
        "use strict";

        const roomInput = document.getElementById("room");
        const usernameInput = document.getElementById("username");
        const passphraseInput = document.getElementById("passphrase");

        const connectButton = document.getElementById("connectButton");
        const sendButton = document.getElementById("sendButton");
        const messageInput = document.getElementById("messageInput");
        const messageForm = document.getElementById("messageForm");

        const messagesBox = document.getElementById("messages");
        const emptyMessage = document.getElementById("emptyMessage");

        const statusBox = document.getElementById("status");
        const statusText = document.getElementById("statusText");

        let socket = null;
        let encryptionKey = null;
        let currentRoom = null;
        let connectionAttempt = 0;

        function setStatus(message, state = "") {
            statusText.textContent = message;
            statusBox.className = "status";

            if (state) {
                statusBox.classList.add(state);
            }
        }

        function addMessage(sender, text) {
            emptyMessage.hidden = true;

            const message = document.createElement("article");
            message.className = "message";

            const senderElement = document.createElement("div");
            senderElement.className = "sender";
            senderElement.textContent = sender;

            const textElement = document.createElement("div");
            textElement.className = "text";
            textElement.textContent = text;

            message.appendChild(senderElement);
            message.appendChild(textElement);

            messagesBox.appendChild(message);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function encodeBase64(bytes) {
            let binary = "";

            for (const byte of bytes) {
                binary += String.fromCharCode(byte);
            }

            return btoa(binary);
        }

        function decodeBase64(value) {
            const binary = atob(value);

            return Uint8Array.from(
                binary,
                character => character.charCodeAt(0)
            );
        }

        async function deriveEncryptionKey(passphrase, roomId) {
            const material = await crypto.subtle.importKey(
                "raw",
                new TextEncoder().encode(passphrase),
                "PBKDF2",
                false,
                ["deriveKey"]
            );

            return crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: new TextEncoder().encode(
                        "secure-chat-room-" + roomId
                    ),
                    iterations: 250000,
                    hash: "SHA-256"
                },
                material,
                {
                    name: "AES-GCM",
                    length: 256
                },
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function encryptMessage(plainText) {
            const iv = crypto.getRandomValues(new Uint8Array(12));

            const encryptedBytes = await crypto.subtle.encrypt(
                {
                    name: "AES-GCM",
                    iv: iv
                },
                encryptionKey,
                new TextEncoder().encode(plainText)
            );

            const combined = new Uint8Array(
                iv.length + encryptedBytes.byteLength
            );

            combined.set(iv, 0);
            combined.set(new Uint8Array(encryptedBytes), iv.length);

            return encodeBase64(combined);
        }

        async function decryptMessage(encodedMessage) {
            const combined = decodeBase64(encodedMessage);

            // AES-GCM requires a 12-byte IV and an authentication tag.
            if (combined.length < 29) {
                throw new Error("Invalid encrypted message");
            }

            const iv = combined.slice(0, 12);
            const encryptedBytes = combined.slice(12);

            const decryptedBytes = await crypto.subtle.decrypt(
                {
                    name: "AES-GCM",
                    iv: iv
                },
                encryptionKey,
                encryptedBytes
            );

            return new TextDecoder().decode(decryptedBytes);
        }

        function disconnect() {
            const oldSocket = socket;

            socket = null;
            encryptionKey = null;
            currentRoom = null;

            sendButton.disabled = true;
            messageInput.disabled = true;

            if (oldSocket) {
                oldSocket.close();
            }
        }

        connectButton.addEventListener("click", async () => {
            const roomId = Number(roomInput.value);
            const username = usernameInput.value.trim();
            const passphrase = passphraseInput.value;

            if (!Number.isInteger(roomId) || roomId < 1) {
                setStatus("Enter a valid room ID.", "error");
                return;
            }

            if (!username || !passphrase) {
                setStatus(
                    "Enter a username and shared passphrase.",
                    "error"
                );
                return;
            }

            if (!window.crypto || !window.crypto.subtle) {
                setStatus(
                    "Browser encryption is unavailable. Use Chrome on localhost.",
                    "error"
                );
                return;
            }

            const attempt = ++connectionAttempt;

            disconnect();
            connectButton.disabled = true;
            setStatus("Preparing encryption...");

            try {
                const newKey = await deriveEncryptionKey(
                    passphrase,
                    roomId
                );

                if (attempt !== connectionAttempt) {
                    return;
                }

                encryptionKey = newKey;
                currentRoom = roomId;

                const scheme =
                    window.location.protocol === "https:" ? "wss:" : "ws:";

                const newSocket = new WebSocket(
                    `${scheme}//${window.location.host}/ws/${roomId}`
                );

                socket = newSocket;

                newSocket.addEventListener("open", () => {
                    if (socket !== newSocket) return;

                    setStatus(
                        `Connected to room ${roomId}`,
                        "connected"
                    );

                    sendButton.disabled = false;
                    messageInput.disabled = false;
                    connectButton.disabled = false;
                    messageInput.focus();
                });

                newSocket.addEventListener("message", async event => {
                    if (socket !== newSocket) return;

                    try {
                        const data = JSON.parse(event.data);
                        const plainText = await decryptMessage(
                            data.ciphertext
                        );

                        addMessage(data.sender, plainText);
                    } catch {
                        addMessage(
                            "System",
                            "A message could not be decrypted. " +
                            "Check that both participants use the same passphrase."
                        );
                    }
                });

                newSocket.addEventListener("close", () => {
                    if (socket !== newSocket) return;

                    socket = null;
                    encryptionKey = null;
                    currentRoom = null;

                    sendButton.disabled = true;
                    messageInput.disabled = true;
                    connectButton.disabled = false;

                    setStatus("Disconnected");
                });

                newSocket.addEventListener("error", () => {
                    if (socket === newSocket) {
                        setStatus(
                            "Connection error. Check the room ID and server.",
                            "error"
                        );
                    }
                });

            } catch (error) {
                if (attempt === connectionAttempt) {
                    encryptionKey = null;
                    currentRoom = null;
                    connectButton.disabled = false;

                    setStatus(
                        "Could not prepare encryption: " + error.message,
                        "error"
                    );
                }
            }
        });

        messageForm.addEventListener("submit", async event => {
            event.preventDefault();

            const text = messageInput.value.trim();

            if (!text) return;

            if (
                !socket ||
                socket.readyState !== WebSocket.OPEN ||
                !encryptionKey ||
                currentRoom === null
            ) {
                setStatus("Connect to a room before sending messages.", "error");
                return;
            }

            sendButton.disabled = true;

            try {
                const ciphertext = await encryptMessage(text);

                if (!socket || socket.readyState !== WebSocket.OPEN) {
                    throw new Error("Connection closed");
                }

                socket.send(JSON.stringify({
                    sender: usernameInput.value.trim().slice(0, 40),
                    ciphertext: ciphertext
                }));

                messageInput.value = "";
                messageInput.focus();

            } catch {
                setStatus("Could not encrypt or send the message.", "error");
            } finally {
                sendButton.disabled = !socket ||
                    socket.readyState !== WebSocket.OPEN;
            }
        });
    </script>

</body>
</html>
